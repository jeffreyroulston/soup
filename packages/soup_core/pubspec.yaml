name: soup_core
description: "Shared non-UI code for Soup apps: Jellyfin API wrapper, Tailscale/identity wiring, caches, view models."
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.12.2

dependencies:
  drift: ^2.34.2
  drift_flutter: ^0.3.1
  flutter:
    sdk: flutter
  flutter_secure_storage: ^10.3.1
  http: ^1.6.0
  jellyfin_api:
    path: ../jellyfin_api
  path_provider: ^2.1.6
  shared_preferences: ^2.5.3
  socks5_proxy: ^2.1.1
  soup_identity:
    path: ../soup_identity
  soup_tailscale:
    path: ../soup_tailscale
  video_player: ^2.14.0

dev_dependencies:
  build_runner: ^2.15.1
  drift_dev: ^2.34.5
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
